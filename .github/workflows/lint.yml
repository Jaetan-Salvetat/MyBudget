name: Run Linter

on:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.6'
          cache: true

      - name: Create .env
        run: echo "GEMINI_API_KEY=" > .env

      - name: Install dependencies
        run: flutter pub get

      - name: Run linter
        run: flutter analyze
