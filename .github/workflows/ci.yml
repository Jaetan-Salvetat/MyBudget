name: CI

on:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: ${{ matrix.package.name }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        package:
          - { name: mybudget, dir: '.', tool: flutter, scope: 'lib test tool' }
          - { name: app_updater, dir: app_updater, tool: flutter, scope: 'lib test' }
          - { name: frosted_ui, dir: frosted_ui, tool: flutter, scope: 'lib test' }
          - { name: frosted_ui_example, dir: frosted_ui/example, tool: flutter, scope: 'lib test' }
          - { name: price_parser, dir: ml/price_parser, tool: dart, scope: 'lib test' }

    defaults:
      run:
        working-directory: ${{ matrix.package.dir }}

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          cache: true

      - name: Install dependencies
        run: ${{ matrix.package.tool }} pub get

      - name: Analyze
        run: ${{ matrix.package.tool }} analyze ${{ matrix.package.scope }}

      - name: Cache models
        if: ${{ matrix.package.name == 'mybudget' }}
        uses: actions/cache@v4
        with:
          path: assets/models
          key: models-${{ hashFiles('tool/models/lock.env') }}

      - name: Fetch models
        if: ${{ matrix.package.name == 'mybudget' }}
        run: ./tool/models/fetch.sh

      - name: Test
        if: ${{ !cancelled() }}
        run: ${{ matrix.package.tool }} test
