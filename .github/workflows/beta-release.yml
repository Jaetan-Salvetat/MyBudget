name: Create Beta Release

on:
  push:
    branches:
      - beta

jobs:
  create_beta_release:
    name: Create Beta Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.6'
          cache: true

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Setup key.properties
        run: |
          echo "storePassword=${{ secrets.KEY_STORE_PASSWORD }}" >> android/key.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> android/key.properties
          echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> android/key.properties

      - name: Decode Keystore
        run: |
          mkdir -p android/app/keystore
          echo ${{ secrets.KEYSTORE_BASE64 }} | base64 -d > android/app/keystore/mybudget_key.jks

      - name: Create .env
        run: echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" > .env

      - name: Flutter pub get
        run: flutter pub get

      - name: Compute beta version
        id: get_version
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed -e 's/version: //' -e 's/+.*//')
          BUILD=$(grep '^version:' pubspec.yaml | sed -e 's/version: //' -e 's/.*+//')

          git fetch --tags
          LAST=$(git tag -l "v${VERSION}-beta.*" | sort -V | tail -n1 | grep -oP 'beta\.\K\d+' || echo 0)
          NEXT=$((LAST + 1))
          BETA_VERSION="${VERSION}-beta.${NEXT}"

          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "build=$BUILD" >> $GITHUB_OUTPUT
          echo "beta_version=$BETA_VERSION" >> $GITHUB_OUTPUT

      - name: Build apk
        run: flutter build apk --flavor beta --release --no-tree-shake-icons --build-name=${{ steps.get_version.outputs.beta_version }} --build-number=${{ steps.get_version.outputs.build }}

      - name: Create Tag
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git tag -a v${{ steps.get_version.outputs.beta_version }} -m "Beta Release v${{ steps.get_version.outputs.beta_version }}"
          git push origin v${{ steps.get_version.outputs.beta_version }}

      - name: Rename APK
        run: |
          mv build/app/outputs/flutter-apk/app-beta-release.apk build/app/outputs/flutter-apk/mybudget-v${{ steps.get_version.outputs.beta_version }}+${{ steps.get_version.outputs.build }}.apk

      - name: Create Release
        uses: softprops/action-gh-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ steps.get_version.outputs.beta_version }}
          name: MyBudget Beta v${{ steps.get_version.outputs.beta_version }}
          body_path: release_notes.md
          generate_release_notes: false
          draft: false
          prerelease: true
          files: |
            build/app/outputs/flutter-apk/mybudget-v${{ steps.get_version.outputs.beta_version }}+${{ steps.get_version.outputs.build }}.apk
