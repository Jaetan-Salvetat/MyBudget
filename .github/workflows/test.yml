name: Run Tests

on:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          cache: true


      - name: Install dependencies
        run: flutter pub get

      - name: Run tests
        run: flutter test --enable-impeller
