name: Run Tests

on:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.6'
          cache: true

      - name: Create .env
        run: echo "OPENROUTER_API_KEY=" > .env

      - name: Install dependencies
        run: flutter pub get

      - name: Run tests
        run: flutter test --enable-impeller
