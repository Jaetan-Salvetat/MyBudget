name: ocr_harness
description: >-
  Banc de test on-device du scan local : suite complète sur corpus d'images
  (dump OCR + flow) et scan d'un ticket via l'appareil photo.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  google_mlkit_text_recognition: ^0.17.1
  image: ^4.3.0
  image_picker: ^1.1.2
  path_provider: ^2.1.6
  receipt_pipeline:
    path: ../../pipeline

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/corpus/
    - assets/models/
